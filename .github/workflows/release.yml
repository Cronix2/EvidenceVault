name: Release (draft)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draft-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Compute SHA-256
        run: |
          cd app/build/outputs/apk/debug
          sha256sum *.apk > SHA256SUMS
          cat SHA256SUMS

      - name: Create or update DRAFT release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          TAG="${TAG:-manual-${GITHUB_RUN_ID}}"
          APK=$(ls app/build/outputs/apk/debug/*.apk)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" app/build/outputs/apk/debug/SHA256SUMS --clobber
          else
            gh release create "$TAG" "$APK" app/build/outputs/apk/debug/SHA256SUMS \
              --draft --title "EvidenceVault $TAG (brouillon)" \
              --notes "Build debug non signé. Brouillon : publication manuelle requise. Tests sur appareil à faire par le testeur."
          fi
