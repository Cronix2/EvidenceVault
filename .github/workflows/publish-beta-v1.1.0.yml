name: Publish EvidenceVault beta v1.1.0

on:
  push:
    branches:
      - release/v1.1.0-beta.1

permissions:
  contents: write

concurrency:
  group: publish-evidencevault-v1.1.0-beta.1
  cancel-in-progress: false

jobs:
  build-verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android SDK
        run: test -d "$ANDROID_HOME"

      - name: Build, test and lint
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon

      - name: Generate checksum
        run: |
          cd app/build/outputs/apk/debug
          sha256sum app-debug.apk > SHA256SUMS

      - name: Publish GitHub beta prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v1.1.0-beta.1"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; aborting to avoid overwriting it."
            exit 1
          fi
          gh release create "$TAG" \
            app/build/outputs/apk/debug/app-debug.apk \
            app/build/outputs/apk/debug/SHA256SUMS \
            --target bdc2caaa1efca14d56ab3571ca3f1dad875cec7e \
            --title "EvidenceVault v1.1.0-beta.1" \
            --prerelease \
            --notes-file CHANGELOG.md
