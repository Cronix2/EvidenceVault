name: Publish EvidenceVault v1.2.0 beta

on:
  push:
    branches:
      - release/publish-v1.2.0-beta.1

permissions:
  contents: write

concurrency:
  group: publish-evidencevault-v1.2.0-beta.1
  cancel-in-progress: false

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout verified master
        uses: actions/checkout@v4
        with:
          ref: '2f09cd8e4d9c9fca31e7bb32dccfe58fafd83ead'
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK
        run: test -d "$ANDROID_HOME"
      - name: Test, lint and assemble
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon
      - name: SHA256 checksum
        run: |
          cd app/build/outputs/apk/debug
          sha256sum app-debug.apk > SHA256SUMS
      - name: Publish GitHub beta
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: |
            EvidenceVault v1.2.0-beta.1 (APK debug pour tests Android)
            
            Nouveautés : interface de capture revue, galerie audio/vidéo, correctifs CameraX et lecture des vidéos chiffrées, PIN du coffre et PIN d'effacement local distinct, déverrouillage biométrique, Pulse expérimental avec serveur HTTPS append-only en opt-in.
            
            IMPORTANT : APK signé avec la clé debug de GitHub Actions ; une mise à jour directe d'une ancienne installation peut être impossible, et désinstaller efface potentiellement les preuves locales. Aucune garantie d'effacement sans trace ou de reconnaissance d'un doigt distinct ; Pulse nécessite un serveur configuré et ne restaure pas les clés Android Keystore. Compression vidéo avancée et tests réels sur téléphone non achevés. Ne pas utiliser pour l'unique copie de preuves importantes.
            
            Détails : docs/PULSE.md et docs/CAPTURE_SECURITY_PULSE.md dans le dépôt.
        run: |
          set -euo pipefail
          TAG=v1.2.0-beta.1
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists"
            exit 1
          fi
          gh release create "$TAG" \
            app/build/outputs/apk/debug/app-debug.apk \
            app/build/outputs/apk/debug/SHA256SUMS \
            --target '2f09cd8e4d9c9fca31e7bb32dccfe58fafd83ead' \
            --title "EvidenceVault v1.2.0-beta.1" \
            --prerelease \
            --notes "$RELEASE_NOTES"
