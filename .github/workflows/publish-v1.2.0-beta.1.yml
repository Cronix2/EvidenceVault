name: Publish EvidenceVault v1.2.0 beta

on:
  push:
    branches:
      - release/publish-v1.2.0-beta.1

permissions:
  contents: write

concurrency:
  group: publish-evidencevault-v1.2.0-beta.1
  cancel-in-progress: false

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout verified master version
        uses: actions/checkout@v4
        with:
          ref: '2f09cd8e4d9c9fca31e7bb32dccfe58fafd83ead'

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android SDK
        run: test -d "$ANDROID_HOME"

      - name: Test, lint and assemble
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon

      - name: SHA256 checksum
        run: |
          cd app/build/outputs/apk/debug
          sha256sum app-debug.apk > SHA256SUMS

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=v1.2.0-beta.1
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Refusing to overwrite existing release $TAG"
            exit 1
          fi
          cat > /tmp/release-notes.md <<'RELEASE_NOTES'
## EvidenceVault v1.2.0-beta.1 — bêta Android

### Nouveautés
- Refonte des contrôles de capture et du coffre, filtres Audio / Vidéo.
- Corrections de gestion CameraX, arrêt et finalisation vidéo ; lecture des fichiers MP4 chiffrés dans le coffre.
- PIN du coffre et PIN séparé pour la purge locale, déverrouillage biométrique Android.
- Mode Pulse expérimental, désactivé par défaut : envois HTTPS des preuves chiffrées, client WorkManager et serveur exemple versionné append-only.

### Restrictions et avertissements
- APK **debug**, signé avec une clé de débogage de CI. Une installation précédente peut ne pas être mise à jour directement en raison de la signature différente. Une désinstallation efface potentiellement les données locales et leurs clés.
- La compilation, les tests unitaires existants et Android Lint passent, **pas de validation sur appareil réel**.
- Android ne distingue pas quel doigt a été authentifié : une empreinte particulière ne peut pas déclencher une purge distincte.
- La suppression locale ne garantit jamais « aucune trace » et ne supprime pas les copies distantes.
- Pulse requiert un serveur HTTPS explicitement configuré et n'offre pas encore de compression vidéo forte ni de restauration portable des clés.
- Ne pas utiliser cette bêta pour conserver l'unique copie de preuves importantes.

Voir `docs/PULSE.md` et `docs/CAPTURE_SECURITY_PULSE.md` pour les conditions de sécurité et de déploiement.
RELEASE_NOTES
          gh release create "$TAG" \
            app/build/outputs/apk/debug/app-debug.apk \
            app/build/outputs/apk/debug/SHA256SUMS \
            --target '2f09cd8e4d9c9fca31e7bb32dccfe58fafd83ead' \
            --title "EvidenceVault v1.2.0-beta.1" \
            --prerelease \
            --notes-file /tmp/release-notes.md
